name: Deploy to Vultr Server

on:
  push:
    branches:
      - main  # 当推送到main分支时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Vultr Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        command_timeout: 30m
        script: |
          echo "=========================================="
          echo "开始自动部署 VideoFlow Pro"
          echo "=========================================="

          # 进入项目目录（如果不存在则克隆）
          if [ ! -d "/var/www/videoflow-pro" ]; then
            echo ">>> 首次部署：克隆仓库..."
            mkdir -p /var/www
            cd /var/www
            git clone ${{ secrets.REPO_URL }} videoflow-pro
            cd videoflow-pro

            # 首次部署：执行完整安装脚本
            echo ">>> 执行完整部署脚本..."
            chmod +x deploy/quick-deploy.sh
            bash deploy/quick-deploy.sh
          else
            echo ">>> 更新代码..."
            cd /var/www/videoflow-pro
            git fetch origin
            git reset --hard origin/main
            git pull origin main

            echo ">>> 当前分支和提交："
            git branch
            git log -1 --oneline

            # 更新部署：只更新代码和重启服务
            echo ">>> 安装后端依赖..."
            cd server
            npm install --production

            echo ">>> 构建前端..."
            cd ../web
            npm install
            npm run build

            echo ">>> 重启后端服务..."
            pm2 restart videoflow-backend || pm2 start ../server/src/index.js --name videoflow-backend

            echo ">>> 重载Nginx..."
            systemctl reload nginx
          fi

          echo ""
          echo "=========================================="
          echo "✅ 部署完成！"
          echo "时间: $(date)"
          echo "=========================================="

          # 显示服务状态
          pm2 status || echo "PM2未安装或无运行服务"
