<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGradient)"/>

  <!-- M字母 - 由连接点和线条组成，象征无限连接 -->
  <g transform="translate(30, 35)">
    <!-- M的左竖线 -->
    <path d="M 5 5 L 5 45" stroke="url(#iconGradient)" stroke-width="6" stroke-linecap="round"/>
    <!-- M的左斜线 -->
    <path d="M 5 5 L 20 25" stroke="url(#iconGradient)" stroke-width="6" stroke-linecap="round"/>
    <!-- M的中间竖线 -->
    <path d="M 20 25 L 20 45" stroke="url(#iconGradient)" stroke-width="5" stroke-linecap="round"/>
    <!-- M的右斜线 -->
    <path d="M 20 25 L 35 5" stroke="url(#iconGradient)" stroke-width="6" stroke-linecap="round"/>
    <!-- M的右竖线 -->
    <path d="M 35 5 L 35 45" stroke="url(#iconGradient)" stroke-width="6" stroke-linecap="round"/>

    <!-- 连接点 - 象征画布节点 -->
    <circle cx="5" cy="5" r="4" fill="#ffffff"/>
    <circle cx="20" cy="25" r="4" fill="#ffffff"/>
    <circle cx="35" cy="5" r="4" fill="#ffffff"/>
    <circle cx="5" cy="45" r="4" fill="#ffffff"/>
    <circle cx="35" cy="45" r="4" fill="#ffffff"/>

    <!-- Pin的象征 - 右侧的固定图钉 -->
    <g transform="translate(45, 10)">
      <circle cx="5" cy="5" r="5" fill="#ffd700"/>
      <path d="M 5 10 L 5 20" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 底部的无限符号暗示 -->
  <path d="M 35 85 Q 45 80, 50 85 T 65 85 Q 75 90, 85 85"
        stroke="url(#iconGradient)"
        stroke-width="2.5"
        fill="none"
        opacity="0.6"
        stroke-linecap="round"/>
</svg>
